aid: kling-ai
url: https://raw.githubusercontent.com/api-evangelist/kling-ai/refs/heads/main/apis.yml
name: Kling AI
kind: company
description: Kling AI is Kuaishou's generative video AI platform. The Kling AI Open
  Platform (developer API) turns text and images into video and imagery through an
  asynchronous create-a-task then query-the-task workflow, covering text-to-video,
  image-to-video, multi-image-to-video, video extension, lip-sync, video effects,
  image generation (Kolors), and Kolors virtual try-on. The API authenticates with
  a JWT signed from an Access Key / Secret Key pair and is billed against prepaid
  resource packs.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: true
  try_now: true
  public: false
  label: Freemium (free trial) · Self-serve signup
  confidence: high
  source:

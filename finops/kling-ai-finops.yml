description: >-
  FinOps view of Kling AI Open Platform spend. The developer API is prepaid:
  accounts buy resource packs and draw them down as generation tasks run. The
  dominant cost driver is video generation, metered by seconds of output and
  multiplied by professional mode and native audio; image generation and
  virtual try-on are cheaper per unit. Because it is prepaid and failed API
  tasks are reported not to deduct resources, spend is bounded by pack balance
  rather than an open-ended monthly invoice. Per-unit rates are not reconciled
  here.
notes: >-
  Reconcile per-second video rates, per-image rates, and resource-pack SKUs
  against the live Kling AI Open Platform pricing before using for budgeting.
  Optimize by choosing standard over professional mode where quality allows,
  keeping clips short, and only enabling native audio when needed.

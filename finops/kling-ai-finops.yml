meters:
- name: video_seconds
  description: Seconds of generated video across text-to-video, image-to-video, multi-image, extension, lip-sync, and effects, drawn from prepaid resource packs.
  unit: seconds
  aggregation: sum
  dimensions:
  - account
  - model
  - mode
- name: native_audio_seconds
  description: Seconds of video generated with native audio on audio-capable models, at roughly double the base per-second rate.
  unit: seconds
  aggregation: sum
  dimensions:
  - account
  - model
- name: images_generated
  description: Still images produced via Kolors image generation and virtual try-on.
  unit: images
  aggregation: sum
  dimensions:
  - account
  - model
- name: resource_pack_balance
  description: Remaining prepaid resource-pack balance available for consumption.
  unit: credits
  aggregation: last
  dimensions:
  - account
  - resource_pack
principles:
- name: Visibility
  description: Track video-seconds and images per model and mode via the account resource query; monitor resource-pack balance to avoid task rejections on depletion.
- name: Allocation
  description: Separate Access Keys per workload/environment so consumption maps to teams or projects.
- name: Optimization
  description: Prefer standard mode over professional where acceptable, keep durations short, enable native audio only when required, and rely on no-charge-on-failure to avoid paying for failed renders.
- name: Accountability
  description: Assign owners per key/project and review resource-pack burn-down against budget.
